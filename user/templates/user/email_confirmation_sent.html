{% extends 'base.html' %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h3>Письмо с подтверждением отправлено</h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <h4 class="alert-heading">Почти готово!</h4>
                        <p>
                            Мы отправили письмо с инструкциями по активации вашего аккаунта на адрес <strong>{{ user.email }}</strong>.
                        </p>
                        <hr>
                    </div>
                    <a href="{% url 'products:home' %}" class="btn btn-primary">На главную</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
