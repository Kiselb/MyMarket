{% extends 'base.html' %}

{% block title %}Профиль{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <h2 class="mb-4">Профиль пользователя</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
        <div class="mt-3">
            <a href="{% url 'change_password' %}" class="btn btn-outline-secondary">Изменить пароль</a>
        </div>
    </div>
</div>
{% endblock %}
